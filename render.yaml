services:
  - type: web
    name: apex-ai-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: OLLAMA_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0